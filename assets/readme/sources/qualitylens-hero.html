<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1600, initial-scale=1">
  <title>QualityLens README Hero</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
    body {
      font-family: "Noto Sans KR", "Pretendard", "Malgun Gothic", sans-serif;
      color: #f8fbff;
      background: #031733 url("../qualitylens-hero-background.png") center / cover no-repeat;
    }
    .canvas {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(2, 15, 37, .28) 0%, rgba(2, 15, 37, .12) 46%, rgba(2, 15, 37, .04) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, .05), rgba(0, 17, 42, .22));
    }
    .glow {
      position: absolute;
      inset: auto auto -260px -180px;
      width: 920px;
      height: 620px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(17, 196, 211, .23), rgba(13, 78, 150, .05) 58%, transparent 72%);
      filter: blur(6px);
    }
    .copy {
      position: absolute;
      left: 92px;
      top: 158px;
      width: 615px;
      z-index: 2;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      color: #7ee8f2;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: .16em;
    }
    .eyebrow::before {
      content: "";
      width: 36px;
      height: 3px;
      border-radius: 999px;
      background: #35d8e5;
      box-shadow: 0 0 18px rgba(53, 216, 229, .9);
    }
    h1 {
      margin: 0;
      font-size: 94px;
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 900;
      text-shadow: 0 10px 36px rgba(0, 0, 0, .32);
    }
    .subtitle {
      margin: 28px 0 22px;
      font-size: 31px;
      line-height: 1.42;
      font-weight: 750;
      letter-spacing: -.025em;
      color: #e9f6ff;
    }
    .flow {
      margin: 0 0 36px;
      color: #6ff2db;
      font-size: 29px;
      font-weight: 850;
      letter-spacing: .01em;
    }
    .stack {
      display: inline-flex;
      max-width: 600px;
      padding: 15px 21px;
      border: 1px solid rgba(160, 230, 255, .36);
      border-radius: 15px;
      background: rgba(6, 34, 66, .55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 12px 30px rgba(0, 12, 34, .2);
      color: #dcefff;
      font-size: 19px;
      font-weight: 650;
      backdrop-filter: blur(8px);
    }
    .browser {
      position: absolute;
      right: 74px;
      top: 132px;
      width: 790px;
      height: 600px;
      overflow: hidden;
      border: 1px solid rgba(191, 233, 255, .55);
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 38px 85px rgba(0, 17, 45, .44), 0 0 0 8px rgba(112, 205, 247, .08);
      transform: perspective(1800px) rotateY(-3deg) rotateX(1deg);
      transform-origin: right center;
    }
    .chrome {
      display: flex;
      align-items: center;
      height: 54px;
      padding: 0 20px;
      gap: 9px;
      background: linear-gradient(180deg, #f5f9fd, #e7eef6);
      border-bottom: 1px solid #cfdae7;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff6b6b; }
    .dot.yellow { background: #f7bd45; }
    .dot.green { background: #31c48d; }
    .address {
      margin-left: 12px;
      width: 500px;
      height: 28px;
      padding: 5px 14px;
      border: 1px solid #d4deea;
      border-radius: 8px;
      background: #fff;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
    }
    .screen {
      display: block;
      width: 100%;
      height: calc(100% - 54px);
      object-fit: cover;
      object-position: top left;
    }
    .footer {
      position: absolute;
      left: 92px;
      right: 82px;
      bottom: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(222, 241, 255, .78);
      font-size: 15px;
      letter-spacing: .035em;
    }
    .footer::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -22px;
      height: 1px;
      background: linear-gradient(90deg, rgba(120, 225, 244, .75), rgba(120, 225, 244, .08));
    }
    .footer strong { color: #7ee8f2; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="glow"></div>
    <section class="copy">
      <div class="eyebrow">SMART FACTORY OPERATIONS</div>
      <h1>QualityLens</h1>
      <p class="subtitle">AI 기반 스마트 공장 운영 시스템</p>
      <p class="flow">Predict → Explain → Act</p>
      <div class="stack">XGBoost · SHAP · Threshold Engine · SPC/Pareto</div>
    </section>

    <section class="browser" aria-label="QualityLens 실제 배포 화면">
      <div class="chrome">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <div class="address">qualitylens-smart-factory.streamlit.app</div>
      </div>
      <img class="screen" src="../screens/main-dashboard.png" alt="QualityLens 메인 대시보드 실제 화면">
    </section>

    <div class="footer">
      <span><strong>QUALITY THROUGH A LENS</strong> · 제조 이상 예측부터 현장 조치까지</span>
      <span>2026 SMART FACTORY MVP</span>
    </div>
  </main>
</body>
</html>
